name: Verbier Train Ticket Alert

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Invia un messaggio Telegram di prova"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '3-58/5 * * 11 1-5'

permissions:
  contents: read

concurrency:
  group: verbier-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification && 'true' || 'false' }}
        run: python check_verbier.py
